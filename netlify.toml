[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'Site ready'"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
